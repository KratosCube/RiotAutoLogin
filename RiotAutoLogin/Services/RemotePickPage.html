<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#060c14">
  <title>Remote Pick</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #050b13;
      --panel: #0d1824;
      --panel-soft: #122333;
      --line: rgba(200, 170, 110, .28);
      --gold: #c8aa6e;
      --gold-light: #f1d594;
      --cyan: #39d5c5;
      --red: #f28a91;
      --text: #f3efe5;
      --muted: #b5c0cb;
      font-family: system-ui, -apple-system, Segoe UI, sans-serif;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-width: 280px;
      color: var(--text);
      background: radial-gradient(ellipse 75% 32rem at 50% -8rem, #244152 0%, transparent 72%),
                  linear-gradient(135deg, #050b13, #0b1420 53%, #050b13);
    }
    body.modal-open { overflow: hidden; }
    button, input { font: inherit; }
    button { cursor: pointer; }
    button:disabled { opacity: .46; cursor: not-allowed; }
    button:focus-visible, input:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
    [hidden] { display: none !important; }
    .app { width: min(100%, 1680px); margin: 0 auto; padding: 24px clamp(12px, 2vw, 30px) 48px; }
    .site-header { display: flex; align-items: center; justify-content: space-between; gap: 18px; margin-bottom: 13px; }
    .section-title, .field-label { color: var(--gold); font-size: .76rem; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; }
    h1 { font: 500 clamp(1.8rem, 3vw, 2.6rem)/1.1 Georgia, serif; letter-spacing: .02em; margin: 0; color: var(--gold-light); }
    .header-actions { display: flex; align-items: center; gap: 9px; }
    .connection { display: inline-flex; align-items: center; padding: 10px; color: var(--muted); font-size: 0; }
    .connection::before { content: ''; width: 10px; height: 10px; border-radius: 50%; background: var(--gold); }
    .connection.online::before { background: var(--cyan); }
    .connection.offline::before { background: var(--red); }
    .subtle-button, .leave-button, .search-clear, .modal-button {
      min-height: 42px; padding: 9px 14px; color: var(--text); border: 1px solid var(--line);
      background: #101d2a; font-size: .86rem; font-weight: 700;
    }
    .subtle-button:hover:not(:disabled), .search-clear:hover:not(:disabled), .modal-button:hover:not(:disabled) { background: #1a3041; border-color: var(--gold); }
    .status {
      position: sticky; top: 0; z-index: 20; display: grid; grid-template-columns: minmax(0, 1fr) auto;
      border: 1px solid var(--line); background: rgba(8, 18, 29, .97);
      box-shadow: 0 18px 40px rgba(0, 0, 0, .3); backdrop-filter: blur(14px);
    }
    .status-main { min-width: 0; padding: 11px 16px; }
    .phase { color: var(--cyan); font-size: .83rem; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
    .message { margin: 6px 0 0; color: var(--red); font-size: .84rem; line-height: 1.3; }
    .status-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 7px; margin-top: 8px; }
    .loadout-shortcut { display: inline-flex; align-items: center; gap: 6px; max-width: 100%; min-height: 34px; padding: 3px 8px; color: var(--text); background: rgba(57, 213, 197, .07); border: 1px solid rgba(57, 213, 197, .38); text-align: left; font-size: .78rem; }
    .loadout-shortcut strong { max-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .loadout-shortcut > img { width: 25px; height: 25px; object-fit: contain; }
    .shortcut-spells { display: flex; gap: 2px; margin-left: 2px; }
    .shortcut-spells img { width: 20px; height: 20px; border: 1px solid var(--line); }
    .turn-pill { padding: 6px 10px; color: #d9fff9; border: 1px solid rgba(57, 213, 197, .48); background: rgba(57, 213, 197, .11); font-size: .76rem; font-weight: 800; }
    .turn-pill.waiting { color: var(--gold-light); border-color: var(--line); background: rgba(200, 170, 110, .08); }
    .turn-pill.ban { color: #ffd5d8; border-color: rgba(242, 138, 145, .53); background: rgba(242, 138, 145, .12); }
    .turn-pill.loading { color: var(--gold-light); }
    .leave-button { min-height: 34px; padding: 6px 11px; color: #ffd5d8; border-color: rgba(242, 138, 145, .48); background: rgba(242, 138, 145, .08); }
    .leave-button:hover:not(:disabled) { background: rgba(242, 138, 145, .2); }
    .timer-box { min-width: 125px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 12px 18px; border-left: 1px solid var(--line); background: rgba(0, 0, 0, .18); }
    .timer-value { color: var(--gold-light); font-variant-numeric: tabular-nums; font-size: 2.5rem; line-height: 1; font-weight: 800; }
    .timer-value.game { font-size: 1.65rem; }
    .timer-label { margin-top: 6px; color: var(--muted); font-size: .75rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; }
    .hover-readout { display: inline-flex; align-items: center; gap: 8px; max-width: 100%; margin-top: 7px; padding: 3px 9px 3px 3px; border: 1px solid rgba(57, 213, 197, .48); background: rgba(57, 213, 197, .07); }
    .hover-readout img { width: 35px; height: 35px; object-fit: cover; background: #112333; }
    .hover-readout span { display: block; color: var(--cyan); font-size: .65rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
    .hover-readout strong { display: block; overflow: hidden; max-width: 240px; white-space: nowrap; text-overflow: ellipsis; font-size: .86rem; }
    .hover-readout small { display: block; color: var(--muted); font-size: .7rem; }
    .draft-strip { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; padding: 8px 12px; border-top: 1px solid var(--line); background: rgba(4, 11, 18, .72); }
    .draft-team { display: flex; align-items: center; gap: 9px; min-width: 0; }
    .draft-team-label { width: 52px; flex: none; color: var(--gold-light); font-size: .69rem; font-weight: 800; text-transform: uppercase; }
    .draft-slots { display: flex; gap: 5px; min-width: 0; }
    .draft-slot { position: relative; width: 34px; height: 34px; flex: none; display: grid; place-items: center; border: 1px solid var(--line); background: #142332; color: var(--muted); font-size: .76rem; }
    .draft-slot img { width: 100%; height: 100%; object-fit: cover; }
    a.draft-slot { text-decoration: none; color: var(--text); }
    a.draft-slot:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
    .draft-slot.local { border-color: var(--cyan); }
    .draft-slot.intent { border-style: dashed; }
    .draft-slot span { position: absolute; right: 1px; bottom: 0; padding: 0 2px; background: #08131f; font-size: .55rem; }
    .mini-card.local { border-color: var(--cyan); }
    .mini-card.pending { opacity: .72; }
    .rune-highlight { padding: 10px; margin: 0 0 10px; border: 1px solid rgba(57, 213, 197, .35); background: rgba(57, 213, 197, .07); }
    .rune-highlight strong { display: block; margin: 4px 0; color: var(--gold-light); font-size: .98rem; }
    .rune-lead { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .rune-lead > span { min-width: 0; }
    .rune-icon { width: 34px; height: 34px; flex: none; object-fit: contain; }
    .rune-glyph { display: grid; place-items: center; width: 34px; height: 34px; flex: none; color: var(--gold-light); font-size: 1.25rem; }
    .rune-paths { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
    .rune-paths img { width: 17px; height: 17px; object-fit: contain; }
    .rune-keys { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 5px; }
    .rune-key { display: inline-flex; align-items: center; gap: 3px; padding: 2px 5px; border: 1px solid rgba(200, 170, 110, .16); background: #142735; font-size: .68rem; }
    .rune-key img { width: 16px; height: 16px; object-fit: contain; }
    .rune-paths, .rune-keys { color: var(--muted); font-size: .74rem; line-height: 1.35; }
    .rune-label { color: var(--cyan); font-size: .7rem; font-weight: 800; text-transform: uppercase; }
    .layout { display: grid; grid-template-columns: 170px minmax(0, 1fr) 225px; align-items: start; gap: 12px; margin-top: 14px; }
    #championView, #desktopLoadout, #allyPanel, #enemyPanel { scroll-margin-top: calc(var(--status-height, 170px) + 12px); }
    #allyPanel { position: sticky; top: var(--status-height, 170px); align-self: start; }
    .right-rail { position: sticky; top: var(--status-height, 170px); display: grid; gap: 12px; min-width: 0; max-height: calc(100dvh - var(--status-height, 170px)); overflow-y: auto; align-self: start; }
    .panel { min-width: 0; border: 1px solid var(--line); background: rgba(11, 22, 34, .94); box-shadow: inset 0 1px rgba(255, 255, 255, .04); }
    .panel h2 { margin: 0; padding: 15px 16px; color: var(--gold-light); border-bottom: 1px solid var(--line); font-size: .88rem; letter-spacing: .1em; text-transform: uppercase; }
    .rail-list { display: grid; gap: 8px; padding: 12px; }
    .rail-empty { margin: 0; padding: 9px 2px; color: var(--muted); line-height: 1.5; font-size: .87rem; }
    .mini-card { display: flex; align-items: center; gap: 10px; min-width: 0; padding: 7px; background: #142332; border: 1px solid rgba(255, 255, 255, .06); }
    .mini-card img, .rail-placeholder { width: 40px; height: 40px; flex: none; object-fit: cover; background: #0a151f; border: 1px solid var(--line); }
    .rail-placeholder { display: grid; place-items: center; color: var(--muted); font-size: .82rem; }
    .mini-card .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: .86rem; font-weight: 700; }
    .mini-card .sub { margin-top: 3px; color: var(--muted); font-size: .76rem; }
    .player-link { color: var(--cyan); text-decoration: none; overflow-wrap: anywhere; }
    .player-link:hover { text-decoration: underline; }
    .search-wrap { display: grid; gap: 9px; margin-bottom: 14px; }
    .search-heading { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
    .count { color: var(--muted); font-size: .84rem; font-variant-numeric: tabular-nums; }
    .search-controls { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
    .search-controls input { min-width: 0; min-height: 46px; width: 100%; padding: 10px 14px; color: var(--text); border: 1px solid var(--line); border-radius: 0; background: #0a1723; font-size: 1rem; }
    .search-controls input::placeholder { color: var(--muted); }
    .champion-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
    .champion { min-width: 0; overflow: hidden; border: 1px solid var(--line); background: var(--panel); transition: border-color .15s, box-shadow .15s; }
    .champion:hover { border-color: var(--gold); }
    .champion.selected-card { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold); }
    .champion.client-hover { border-color: var(--cyan); box-shadow: inset 0 0 0 1px var(--cyan), 0 0 16px rgba(57, 213, 197, .26); }
    .card-select { width: 100%; padding: 0; color: var(--text); border: 0; background: transparent; text-align: left; }
    .portrait { position: relative; display: block; height: clamp(95px, 8vw, 120px); background: linear-gradient(135deg, #152e3b, #08131e); overflow: hidden; }
    .portrait img { display: block; width: 100%; height: 100%; object-fit: cover; transition: transform .2s; }
    .champion:hover .portrait img { transform: scale(1.04); }
    .champion.disabled .portrait img { filter: grayscale(1) brightness(.52); }
    .champion-name { display: block; overflow: hidden; padding: 9px 10px; font-size: .83rem; font-weight: 800; white-space: nowrap; text-overflow: ellipsis; }
    .badge { position: absolute; top: 7px; left: 7px; padding: 4px 6px; border: 1px solid var(--line); color: var(--gold-light); background: rgba(4, 9, 15, .91); font-size: .7rem; font-weight: 800; }
    .badge.banned { color: #ffd5d8; border-color: var(--red); }
    .badge.intent { color: #d9fff9; border-color: var(--cyan); }
    .champion-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; padding: 0 7px 7px; }
    .champion-actions button, .mobile-action-buttons button { min-height: 38px; padding: 5px; color: var(--text); border: 1px solid var(--line); background: #112333; font-size: .76rem; font-weight: 800; }
    .champion-actions button:hover:not(:disabled), .mobile-action-buttons button:hover:not(:disabled) { background: #204154; }
    button.lock { color: #dcfffa; border-color: rgba(57, 213, 197, .57); }
    button.ban { color: #ffd5d8; border-color: rgba(242, 138, 145, .57); }
    .empty-state { padding: 38px 20px; text-align: center; border: 1px dashed var(--line); background: rgba(13, 24, 36, .8); }
    .empty-state strong { display: block; color: var(--gold-light); font: 500 1.3rem Georgia, serif; }
    .empty-state p { margin: 10px auto 0; max-width: 27rem; color: var(--muted); line-height: 1.5; }
    .empty-state button { margin-top: 17px; }
    .loadout { padding: 13px; }
    .loadout-note { margin: 0 0 11px; color: var(--muted); line-height: 1.5; font-size: .86rem; }
    .spell-slots { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .spell-button { display: flex; align-items: center; gap: 8px; min-width: 0; min-height: 57px; padding: 7px; color: var(--text); border: 1px solid var(--line); background: #112333; text-align: left; }
    .spell-button img { width: 36px; height: 36px; flex: none; border: 1px solid var(--line); background: var(--bg); }
    .spell-button span { display: block; color: var(--gold); font-size: .73rem; }
    .spell-button strong { display: block; overflow: hidden; margin-top: 3px; font-size: .83rem; text-overflow: ellipsis; }
    .rune-block { margin-top: 12px; border: 1px solid var(--line); background: rgba(200, 170, 110, .03); }
    .rune-current { padding: 11px; border-bottom: 1px solid var(--line); color: var(--gold-light); font-size: .8rem; font-weight: 800; }
    .rune-list { display: grid; gap: 7px; padding: 8px; }
    .rune-button { display: flex; justify-content: space-between; align-items: center; gap: 8px; min-width: 0; min-height: 45px; padding: 8px; color: var(--text); border: 1px solid rgba(200, 170, 110, .2); background: #112333; text-align: left; font-size: .84rem; }
    .rune-button:hover:not(:disabled), .spell-button:hover:not(:disabled) { border-color: var(--cyan); background: #19384a; }
    .rune-button span { min-width: 0; overflow-wrap: anywhere; }
    .rune-button .rune-lead { flex: 1; }
    .rune-button small { display: block; margin-top: 4px; color: var(--muted); font-size: .75rem; line-height: 1.3; }
    .rune-button em { flex: none; color: var(--gold-light); font-size: .74rem; font-style: normal; font-weight: 800; }
    .mobile-nav, .mobile-action-bar { display: none; }
    .modal-backdrop { position: fixed; inset: 0; z-index: 40; display: flex; justify-content: center; align-items: center; padding: 16px; background: rgba(0, 0, 0, .78); }
    .modal { width: min(100%, 580px); max-height: min(90vh, 750px); overflow-y: auto; border: 1px solid var(--gold); background: #0b1723; box-shadow: 0 24px 70px #000; }
    .modal-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 14px 17px; border-bottom: 1px solid var(--line); }
    .modal-head h2 { margin: 0; color: var(--gold-light); font: 500 1.3rem Georgia, serif; }
    .spell-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(165px, 1fr)); gap: 8px; padding: 16px; }
    .spell-option { display: flex; align-items: center; gap: 10px; min-height: 55px; padding: 8px; color: var(--text); border: 1px solid var(--line); background: var(--panel-soft); text-align: left; }
    .spell-option img { width: 37px; height: 37px; border: 1px solid var(--line); }
    .spell-option:hover { border-color: var(--cyan); background: #1a3545; }
    .confirm-copy { margin: 0; padding: 18px; color: var(--muted); line-height: 1.5; }
    .confirm-actions { display: flex; justify-content: flex-end; gap: 8px; padding: 0 18px 18px; }
    .modal-button.danger { color: #ffd5d8; border-color: var(--red); }
    .modal-button.primary { color: #d9fff9; border-color: var(--cyan); }
    .toast { position: fixed; right: 18px; bottom: 18px; z-index: 50; max-width: min(400px, calc(100vw - 36px)); padding: 14px 17px; border: 1px solid var(--cyan); background: #102b32; box-shadow: 0 16px 40px #0009; line-height: 1.4; }
    .toast.error { border-color: var(--red); background: #3a1c27; }
    .busy .champion-actions button, .busy .mobile-action-buttons button, .busy .loadout button, .busy .leave-button, .busy .spell-option { pointer-events: none; opacity: .52; }
    @media (max-width: 1050px) { .layout { grid-template-columns: 145px minmax(0, 1fr) 195px; gap: 10px; } .champion-grid { grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); } }
    @media (max-width: 850px) {
      html, body { height: 100%; overflow: hidden; }
      .app { height: 100dvh; display: flex; flex-direction: column; min-height: 0; padding: 8px 10px calc(60px + env(safe-area-inset-bottom)); }
      body.has-selection .app { padding-bottom: calc(158px + env(safe-area-inset-bottom)); }
      .site-header { display: none; }
      .status { flex: none; position: static; }
      .status-main { padding: 9px 10px; }
      .phase { font-size: .75rem; }
      .message { font-size: .78rem; }
      .status-actions { margin-top: 5px; gap: 5px; }
      .status-actions .leave-button { display: none; }
      .turn-pill { padding: 4px 6px; font-size: .69rem; }
      .timer-box { min-width: 83px; padding: 8px 9px; }
      .timer-value { font-size: 1.8rem; }
      .timer-value.game { font-size: 1.17rem; }
      .timer-label { font-size: .62rem; }
      .mobile-nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 31; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)) 38px; gap: 4px; padding: 6px 8px calc(6px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); background: #08131e; }
      .mobile-nav.has-leave { grid-template-columns: repeat(3, minmax(0, 1fr)) 38px 52px; }
      .mobile-nav button { min-width: 0; min-height: 44px; padding: 4px 2px; color: var(--muted); border: 1px solid var(--line); background: #101e2b; font-size: .76rem; font-weight: 700; }
      .mobile-nav button[aria-pressed="true"] { color: var(--gold-light); border-color: var(--gold); background: #1b2d3b; }
      .mobile-nav .nav-tool { font-size: 1.25rem; }
      .mobile-nav .nav-leave { color: #ffd5d8; font-size: .7rem; }
      .layout { flex: 1; min-height: 0; overflow: hidden; margin-top: 8px; display: block; }
      .right-rail { display: contents; }
      .layout:not([data-view="champions"]) #championView,
      .layout:not([data-view="loadout"]) #desktopLoadout,
      .layout:not([data-view="picks"]) #allyPanel,
      .layout:not([data-view="picks"]) #enemyPanel { display: none; }
      .layout[data-view="champions"] #championView { display: flex; flex-direction: column; height: 100%; min-height: 0; }
      .layout[data-view="loadout"] #desktopLoadout { display: block; height: 100%; overflow-y: auto; overscroll-behavior: contain; }
      .layout[data-view="picks"] { display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: repeat(2, minmax(0, 1fr)); gap: 8px; }
      .layout[data-view="picks"] #allyPanel, .layout[data-view="picks"] #enemyPanel { position: static; display: flex; flex-direction: column; min-height: 0; overflow-y: auto; overscroll-behavior: contain; }
      .layout[data-view="picks"] #allyPanel { order: 1; }
      .layout[data-view="picks"] #enemyPanel { order: 2; }
      .panel h2 { flex: none; padding: 10px 12px; }
      .rail-list { gap: 4px; padding: 8px; }
      .mini-card { padding: 4px; min-height: 43px; }
      .mini-card img, .rail-placeholder { width: 34px; height: 34px; }
      .hover-readout { margin-top: 7px; padding: 3px 7px 3px 3px; }
      .hover-readout img { width: 28px; height: 28px; }
      .hover-readout small:empty { display: none; }
      .draft-strip { grid-template-columns: 1fr; gap: 4px; padding: 5px 9px; }
      .draft-team-label { width: 42px; font-size: .65rem; }
      .draft-slot { width: 27px; height: 27px; }
      .draft-slots { gap: 4px; }
      .search-wrap { flex: none; margin-bottom: 8px; }
      .search-controls input { min-height: 42px; }
      #champions { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; align-content: start; }
      #champions:empty { display: none; }
      .empty-state { flex: 1; overflow-y: auto; }
      .champion-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
      .portrait { height: clamp(76px, 20vw, 105px); }
      .champion-name { padding: 8px 6px; font-size: .77rem; }
      .champion-actions { display: none; }
      .mobile-action-bar { position: fixed; left: 0; right: 0; bottom: calc(56px + env(safe-area-inset-bottom)); z-index: 30; gap: 5px; padding: 6px 10px; border-top: 1px solid var(--gold); background: rgba(6, 14, 22, .98); box-shadow: 0 -12px 35px #0009; }
      body.has-selection .mobile-action-bar { display: grid; }
      .mobile-selected { display: flex; align-items: center; gap: 9px; min-width: 0; }
      .mobile-selected img { width: 30px; height: 30px; object-fit: cover; border: 1px solid var(--line); background: #0a151f; }
      .mobile-selected strong { display: block; font-size: .85rem; }
      .mobile-selected span { display: block; margin-top: 2px; color: var(--muted); font-size: .72rem; }
      .mobile-action-buttons { display: flex; gap: 7px; }
      .mobile-action-buttons button { flex: 1; min-height: 42px; font-size: .82rem; }
      body.searching.has-selection .app { padding-bottom: calc(60px + env(safe-area-inset-bottom)); }
      body.searching .mobile-action-bar, body.searching .draft-strip, body.searching .status-actions { display: none; }
      .toast { right: 10px; bottom: calc(160px + env(safe-area-inset-bottom)); }
      body:not(.has-selection) .toast { bottom: calc(60px + env(safe-area-inset-bottom)); }
    }

    }

    }

      const error = state.isInChampSelect && (state.message || '').startsWith('Could not read');

      ui.turn.className = `turn-pill ${canBan ? 'ban' : ''}`;

      ui.leave.hidden = !state.canLeave;
      ui.mobileLeave.disabled = ui.leave.disabled;
      ui.mobileLeave.hidden = ui.leave.hidden;
      ui.nav.classList.toggle('has-leave', state.canLeave);

      renderHoverReadout();

    function getChampionMeta(id) {

        const fragment = document.createDocumentFragment();
        for (let index = 0; index < Math.max(5, slots.length); index++) {

            id ? `${team} ${index + 1}: ${meta.name}${!slot.championId ? ' (intent)' : ''}` : `${team} ${index + 1}`;

    function showDisconnectedState() {

    async function getJson(url) {

    }

      if (!champions.length) {

        filtered.map(champion => [champion.id, champion.name, champion.imageUrl, champion.isDisabled, champion.isBanned, champion.isPicked])]);

    function renderMobileActions() {
      const champion = getSelectedChampion();
      document.body.classList.toggle('has-selection', !!champion && !!state?.isInChampSelect);
      if (!champion) {
        ui.selectedImage.removeAttribute('src'); ui.selectedName.textContent = 'Select champion';
        ui.selectedHint.textContent = '';
        ui.hover.disabled = ui.ban.disabled = ui.pick.disabled = true;
        return;
      }
      if (champion.imageUrl && ui.selectedImage.getAttribute('src') !== champion.imageUrl) ui.selectedImage.src = champion.imageUrl;
      else if (!champion.imageUrl) ui.selectedImage.removeAttribute('src');
      ui.selectedName.textContent = champion.name;
      ui.selectedHint.textContent = champion.isBanned ? 'Banned' : champion.isPicked ? 'Picked' :
        state.canBan && state.hoveredBanChampionId === champion.id ? (state.banFallbackArmed ? 'Ban set · auto near end' : 'Ban slot') :
        state.hoveredChampionId === champion.id ? 'In client' :
        state.selectedChampionId === champion.id ? 'Selected' : '';
      const ready = hasFullState && !actionPending && !champion.isDisabled && state.isInChampSelect;
      const canBan = state.canBan || (state.isMyTurn && state.actionType === 'ban');
      const canPick = state.canPick || (state.isMyTurn && state.actionType === 'pick');
      ui.hover.textContent = canBan ? 'Set ban' : 'Hover';
      ui.hover.disabled = !ready || (state.actionType === 'ban' && !canBan);
      ui.ban.hidden = !canBan;
      ui.pick.hidden = !canPick || canBan;
      ui.ban.disabled = !ready || !canBan;
      ui.pick.disabled = !ready || !canPick;
    }
    function renderRail(target, slots, team) {
      const fragment = document.createDocumentFragment();
      for (let index = 0; index < Math.max(5, slots.length); index++) {
        const slot = slots[index] || {}, id = slot.championId || slot.intentChampionId || 0;
        const meta = slot.name ? slot : getChampionMeta(id);
        const row = document.createElement('div');
        row.className = `mini-card${slot.isLocalPlayer ? ' local' : ''}${id ? '' : ' pending'}`;
        row.innerHTML = `${id && meta.imageUrl
          ? `<img src="${escapeAttr(meta.imageUrl)}" alt="" loading="lazy">`
          : `<span class="rail-placeholder">${index + 1}</span>`}
          <div><div class="name">${escapeHtml(id ? meta.name : team + ' ' + (index + 1))}</div>
          <div class="sub">${slot.profileUrl && slot.playerName
            ? `<a class="player-link" href="${escapeAttr(slot.profileUrl)}" target="_blank" rel="noopener noreferrer" aria-label="${escapeAttr('Open ' + slot.playerName + ' on League of Graphs')}">${escapeHtml(slot.playerName)} ↗</a>`
            : `${team} ${index + 1}${slot.isLocalPlayer ? ' · You' : ''}${id && !slot.championId ? ' · Intent' : ''}`}</div></div>`;
        fragment.appendChild(row);
      }
      target.replaceChildren(fragment);
    }
    function renderSpellButton(slot, spell) {
      return `<button type="button" class="spell-button" data-slot="${slot}" ${state.isInChampSelect ? '' : 'disabled'}>${spell ? `<img src="${escapeAttr(spell.imageUrl)}" alt="">` : ''}<div><span>Spell ${slot}</span><strong>${spell ? escapeHtml(spell.name) : 'Choose'}</strong></div></button>`;
    }
    function runeIcon(url, className = 'rune-icon') {
      return url ? `<img class="${className}" src="${escapeAttr(url)}" alt="" loading="lazy">`
        : '<span class="rune-glyph" aria-hidden="true">✦</span>';
    }
    function renderRuneDetails(page) {
      const paths = [[page.primaryStyleName, page.primaryStyleIconUrl], [page.secondaryStyleName, page.secondaryStyleIconUrl]]
        .filter(([name]) => name).map(([name, url]) => `${url ? runeIcon(url, 'rune-path-icon') : ''}${escapeHtml(name)}`).join(' · ');
      const keys = (page.keyRuneNames || []).slice(1, 4).map((name, index) => {
        const url = page.keyRuneIconUrls?.[index + 1];
        return `<span class="rune-key">${url ? runeIcon(url, 'rune-key-icon') : ''}${escapeHtml(name)}</span>`;
      }).join('');
      return `${paths ? `<span class="rune-paths">${paths}</span>` : ''}${keys ? `<span class="rune-keys">${keys}</span>` : ''}`;
    }
    function renderRecommendedRunes() {
      const pages = state.recommendedRunePages || [];
      if (!pages.length) return '';
      return `<div class="rune-block"><div class="rune-current">Recommended</div><div class="rune-list">${pages.map(page =>
        `<button type="button" class="rune-button" data-recommended-index="${page.index}" ${page.canApply === false ? 'disabled' : ''}>
          <span class="rune-lead">${runeIcon(page.keystoneIconUrl)}<span><strong>${escapeHtml(page.keystoneName || page.name || `Set ${page.index + 1}`)}</strong>
          ${renderRuneDetails(page)}</span></span><em>Apply</em></button>`
      ).join('')}</div></div>`;
    }
    function renderSavedRunes() {
      const pages = state.runePages || [], current = state.currentRunePage || pages.find(page => page.isCurrent);
      if (!pages.length) return '';
      const preview = current ? `<div class="rune-highlight"><span class="rune-label">Active</span><div class="rune-lead">${runeIcon(current.keystoneIconUrl)}<span>
        <strong>${escapeHtml(current.keystoneName || current.name)}</strong>${renderRuneDetails(current)}</span></div></div>` : '';
      return `<div class="rune-block"><div class="rune-current">Saved pages</div><div class="rune-list">${preview}
        ${pages.map(page => `<button type="button" class="rune-button" data-rune-id="${page.id}" ${page.isCurrent ? 'disabled' : ''}>
          <span class="rune-lead">${runeIcon(page.keystoneIconUrl)}<span>${escapeHtml(page.name)}${page.keystoneName ? `<small>${escapeHtml(page.keystoneName)}</small>` : ''}</span></span>
          <em>${page.isCurrent ? 'Active' : 'Set'}</em></button>`).join('')}</div></div>`;
    }
    function renderLoadoutShortcut() {
      if (!state?.isInChampSelect) return;
      const current = state.currentRunePage || (state.runePages || []).find(page => page.isCurrent);
      const spells = [state.spell1Id, state.spell2Id]
        .map(id => (state.summonerSpells || []).find(spell => spell.id === id))
        .filter(Boolean);
      const key = JSON.stringify([current?.id, current?.keystoneName, current?.keystoneIconUrl, spells.map(spell => [spell.id, spell.imageUrl])]);
      if (key === loadoutShortcutKey) return;
      loadoutShortcutKey = key;
      ui.shortcutRuneName.textContent = current?.keystoneName || current?.name || 'Loadout';
      ui.shortcutRuneIcon.hidden = !current?.keystoneIconUrl;
      if (ui.shortcutRuneIcon.hidden) ui.shortcutRuneIcon.removeAttribute('src');
      else if (ui.shortcutRuneIcon.getAttribute('src') !== current.keystoneIconUrl) ui.shortcutRuneIcon.src = current.keystoneIconUrl;
      ui.shortcutSpells.innerHTML = spells.map(spell => `<img src="${escapeAttr(spell.imageUrl)}" alt="${escapeAttr(spell.name)}">`).join('');
    }
    function renderLoadout() {
      if (!state) return;
      renderLoadoutShortcut();
      const key = JSON.stringify([state.isInChampSelect, state.spell1Id, state.spell2Id,
        state.summonerSpells, state.runePages, state.currentRunePage, state.recommendedRunePages]);
      if (key === loadoutKey) return;
      loadoutKey = key;
      const focused = document.activeElement?.dataset;
      const focusSelector = focused?.slot ? `[data-slot="${focused.slot}"]` :
        focused?.runeId ? `[data-rune-id="${focused.runeId}"]` :
        focused?.recommendedIndex ? `[data-recommended-index="${focused.recommendedIndex}"]` : null;
      if (!state.isInChampSelect) {
        ui.loadout.innerHTML = '<h2>Loadout</h2><div class="loadout"><p class="loadout-note">Available in champion select.</p></div>';
        return;
      }
      const spells = state.summonerSpells || [];
      ui.loadout.innerHTML = `<h2>Loadout</h2><div class="loadout"><div class="spell-slots">${renderSpellButton(1, spells.find(spell => spell.isSpell1))}${renderSpellButton(2, spells.find(spell => spell.isSpell2))}</div>${renderRecommendedRunes()}${renderSavedRunes()}</div>`;
      for (const button of ui.loadout.querySelectorAll('[data-slot]')) button.onclick = () => openSpellModal(Number(button.dataset.slot));
      for (const button of ui.loadout.querySelectorAll('[data-rune-id]')) button.onclick = () => selectRunePage(Number(button.dataset.runeId));
      for (const button of ui.loadout.querySelectorAll('[data-recommended-index]')) button.onclick = () => selectRecommendedRunes(Number(button.dataset.recommendedIndex));
      if (focusSelector) ui.loadout.querySelector(focusSelector)?.focus({preventScroll: true});
    }
    function openModal(modal, initialFocus) {
      returnFocus = document.activeElement;
      activeModal = modal;
      modal.hidden = false;
      document.body.classList.add('modal-open');
      (initialFocus || modal.querySelector('button'))?.focus();
    }
    function closeModal(modal) {
      modal.hidden = true;
      if (activeModal === modal) activeModal = null;
      document.body.classList.remove('modal-open');
      const replacement = returnFocus?.dataset?.slot ? ui.loadout.querySelector(`[data-slot="${returnFocus.dataset.slot}"]`) : null;
      (returnFocus?.isConnected ? returnFocus : replacement || ui.search)?.focus({preventScroll: true});
      returnFocus = null;
    }
    function closeSpellModal() { if (!ui.spellModal.hidden) closeModal(ui.spellModal); }
    function resolveConfirm(accepted) {
      if (ui.confirmModal.hidden) return;
      closeModal(ui.confirmModal);
      const resolve = confirmResolve; confirmResolve = null;
      resolve?.(accepted);
    }
    function confirmAction(title, message, buttonText, danger = false) {
      if (activeModal || actionPending) return Promise.resolve(false);
      ui.confirmTitle.textContent = title;
      ui.confirmCopy.textContent = message;
      ui.confirmAccept.textContent = buttonText;
      ui.confirmAccept.className = `modal-button ${danger ? 'danger' : 'primary'}`;
      return new Promise(resolve => { confirmResolve = resolve; openModal(ui.confirmModal, $('cancelConfirm')); });
    }
    function openSpellModal(slot) {
      if (!state?.isInChampSelect || activeModal) return;
      ui.spellTitle.textContent = `Choose summoner spell ${slot}`;
      ui.spellGrid.replaceChildren();
      const spells = state.summonerSpells || [];
      const available = spells.filter(spell => spell.isAvailable);
      if (!available.length) {
        const message = document.createElement('p'); message.className = 'rail-empty';
        message.textContent = 'No summoner spells are available in this mode.';
        ui.spellGrid.appendChild(message);
      }
      for (const spell of available) {
        const button = document.createElement('button'); button.type = 'button'; button.className = 'spell-option';
        button.innerHTML = `<img src="${escapeAttr(spell.imageUrl)}" alt=""><strong>${escapeHtml(spell.name)}</strong>`;
        button.onclick = () => selectSpell(slot, spell.id);
        ui.spellGrid.appendChild(button);
      }
      openModal(ui.spellModal, $('closeSpellModal'));
    }
    async function runAction(path, payload, fallback) {
      if (hoverTask) await hoverTask;
      if (actionPending || !hasFullState) return false;
      actionPending = true;
      document.body.classList.add('busy');
      renderMobileActions();
      try {
        const response = await fetch(path, {
          method: 'POST',
          headers: {'Content-Type': 'application/json', 'X-Remote-Pick-Request': '1'},
          body: JSON.stringify(payload ?? {})
        });
        const result = await response.json();
        if (!response.ok || !result.success) {
          showToast(result.message || 'League Client rejected the action.', true);
          return false;
        }
        showToast(result.message || fallback);
        await loadState();
        await loadTimer();
        return true;
      } catch {
        showToast('Could not reach Remote Pick. Check the connection and try again.', true);
        return false;
      } finally {
        actionPending = false;
        document.body.classList.remove('busy');
        renderMobileActions(); updateStatus();
      }
    }
    async function flushHover() {
      while (queuedHoverId) {
        const id = queuedHoverId;
        const mode = queuedHoverMode;
        queuedHoverId = 0;
        hoveringId = id;
        renderHoverReadout(); renderMobileActions();
        try {
          const response = await fetch(mode === 'ban' ? '/api/ban-hover' : '/api/hover', {
            method: 'POST',
            headers: {'Content-Type': 'application/json', 'X-Remote-Pick-Request': '1'},
            body: JSON.stringify({championId: id})
          });
          const result = await response.json();
          if (state && result.success && typeof result.confirmedChampionId === 'number') {
            if (mode === 'ban') {
              state.hoveredBanChampionId = result.confirmedChampionId;
              state.banFallbackArmed = !!result.autoBanArmed;
            } else {
              state.hoveredChampionId = result.confirmedChampionId;
              state.hoveredChampionSource = result.confirmedChampionSource || '';
            }
            hoverConfirmedAt = performance.now();
          }
          if (!queuedHoverId && (!response.ok || !result.success)) showToast(result.message || 'Hover was not applied.', true);
          renderHoverReadout(); renderMobileActions(); renderChampionGrid();
        } catch {
          if (!queuedHoverId) showToast('Could not verify hover in League Client.', true);
        }
        loadTimer();
      }
      hoveringId = 0;
      renderHoverReadout(); renderMobileActions();
    }
    function hoverChampion(id) {
      if (!hasFullState || !state?.isInChampSelect || actionPending) return Promise.resolve(false);
      queuedHoverId = id;
      queuedHoverMode = state.canBan ? 'ban' : 'pick';
      if (!hoverTask) hoverTask = flushHover().finally(() => { hoverTask = null; });
      return hoverTask;
    }
    async function pickChampion(champion) {
      if (hoverTask) await hoverTask;
      const current = state?.hoveredChampionId ? getChampionMeta(state.hoveredChampionId).name : 'none';
      const message = state?.hoveredChampionId === champion.id
        ? `${champion.name} is the current pick in League Client session. Lock in this pick?`
        : `League Client session currently shows ${current}. Locking in ${champion.name} will set your pick to this champion.`;
      if (await confirmAction(`Lock in ${champion.name}?`, message, 'Lock in'))
        await runAction('/api/pick', {championId: champion.id}, 'Champion locked in.');
    }
    async function banChampion(champion) {
      if (await confirmAction(`Ban ${champion.name}?`, 'This will confirm your champion ban in League Client.', 'Ban champion', true))
        await runAction('/api/ban', {championId: champion.id}, 'Champion banned.');
    }
    async function selectSpell(slot, spellId) {
      if (await runAction('/api/spell', {slot, spellId}, 'Summoner spell updated.')) closeSpellModal();
    }
    function selectRunePage(pageId) { return runAction('/api/rune-page', {pageId}, 'Rune page selected.'); }
    function selectRecommendedRunes(index) { return runAction('/api/recommended-rune-page', {index}, 'Recommended runes applied.'); }
    async function leaveLobby() {
      if (!state?.canLeave) return;
      const label = ui.leave.textContent || 'Leave lobby';
      const warning = state.phase === 'ChampSelect'
        ? 'You will leave champion select. League Client may apply a dodge penalty.'
        : state.phase === 'ReadyCheck' ? 'You will decline this ready check.' : 'You will leave the current lobby or queue.';
      if (await confirmAction(`${label}?`, warning, label, true)) await runAction('/api/leave', {}, 'Leave request sent.');
    }
    function setView(view) {
      ui.layout.dataset.view = view;
      document.body.dataset.view = view;
      for (const button of document.querySelectorAll('[data-view-button]')) button.setAttribute('aria-pressed', String(button.dataset.viewButton === view));
      if (window.matchMedia('(max-width: 850px)').matches) return;
      const target = view === 'loadout' ? ui.loadout : view === 'picks' ? $('allyPanel') : $('championView');
      target?.scrollIntoView({behavior: window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'instant' : 'smooth', block: 'start'});
    }
    function clearSearch() {
      ui.search.value = ''; query = ''; ui.clearSearch.hidden = true;
      gridKey = ''; renderChampionGrid(); ui.search.focus();
    }
    ui.search.addEventListener('input', () => {
      query = ui.search.value.trim().toLocaleLowerCase();
      ui.clearSearch.hidden = !query;
      gridKey = ''; renderChampionGrid();
    });
    ui.search.addEventListener('focus', () => document.body.classList.add('searching'));
    ui.search.addEventListener('blur', () => document.body.classList.remove('searching'));
    ui.clearSearch.onclick = clearSearch;
    ui.emptyClear.onclick = clearSearch;
    $('refreshButton').onclick = () => { loadState(); loadTimer(); };
    $('mobileRefreshButton').onclick = $('refreshButton').onclick;
    ui.loadoutShortcut.onclick = () => setView('loadout');
    ui.loadout.addEventListener('error', event => { if (event.target instanceof HTMLImageElement) event.target.hidden = true; }, true);
    ui.leave.onclick = leaveLobby;
    ui.mobileLeave.onclick = leaveLobby;
    ui.hover.onclick = () => { const champion = getSelectedChampion(); if (champion) hoverChampion(champion.id); };
    ui.ban.onclick = () => { const champion = getSelectedChampion(); if (champion) banChampion(champion); };
    ui.pick.onclick = () => { const champion = getSelectedChampion(); if (champion) pickChampion(champion); };
    $('closeSpellModal').onclick = closeSpellModal;
    $('cancelConfirm').onclick = () => resolveConfirm(false);
    ui.confirmAccept.onclick = () => resolveConfirm(true);
    ui.spellModal.onclick = event => { if (event.target === ui.spellModal && !actionPending) closeSpellModal(); };
    ui.confirmModal.onclick = event => { if (event.target === ui.confirmModal) resolveConfirm(false); };
    for (const button of document.querySelectorAll('[data-view-button]')) button.onclick = () => setView(button.dataset.viewButton);
    document.addEventListener('keydown', event => {
      if (!activeModal) return;
      if (event.key === 'Escape') {
        event.preventDefault();
        if (activeModal === ui.spellModal && !actionPending) closeSpellModal();
        else if (activeModal === ui.confirmModal) resolveConfirm(false);
      }
      if (event.key !== 'Tab') return;
      const focusable = [...activeModal.querySelectorAll('button:not([disabled])')];
      if (!focusable.length) return;
      const first = focusable[0], last = focusable.at(-1);
      if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last.focus(); }
      else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus(); }
    });
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') { loadState(); loadTimer(); }
    });
    if ('ResizeObserver' in window) {
      new ResizeObserver(() => document.documentElement.style.setProperty('--status-height', `${ui.status.getBoundingClientRect().height + 12}px`)).observe(ui.status);
    }
    loadState(); loadTimer();
    setInterval(() => { if (document.visibilityState === 'visible') loadTimer(); }, 1000);
    setInterval(() => { if (document.visibilityState === 'visible') loadState(); }, 4000);
    setInterval(updateTimerDisplay, 250);
  </script>
</body>
</html>
