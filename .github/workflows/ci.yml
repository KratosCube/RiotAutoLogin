name: Build

on:
  push:
    branches:
      - master
      - 'codex/**'
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore RiotAutoLogin/RiotAutoLogin.csproj

      - name: Build
        run: dotnet build RiotAutoLogin/RiotAutoLogin.csproj --configuration Release --no-restore /p:ContinuousIntegrationBuild=true

      - name: Verify queue statistics and time tracking
        run: dotnet run --project RiotAutoLogin.Tests/RiotAutoLogin.Tests.csproj --configuration Release

      - name: Check Remote Pick in mobile and desktop Chrome
        shell: pwsh
        run: |
          $tools = Join-Path $env:RUNNER_TEMP "remote-pick-check"
          npm install --prefix $tools --no-audit --no-fund --ignore-scripts playwright-core@1.56.1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:NODE_PATH = Join-Path $tools "node_modules"
          node RiotAutoLogin.UiChecks/remote-pick.cjs

      - name: Check Quick Login at startup and open Accounts and Settings on Windows
        run: dotnet run --project RiotAutoLogin.UiChecks/RiotAutoLogin.UiChecks.csproj --configuration Release

      - name: Verify isolated developer build
        shell: pwsh
        run: |
          dotnet publish RiotAutoLogin/RiotAutoLogin.csproj -c Release -r win-x64 --self-contained true -o build/dev /p:DeveloperBuild=true /p:PublishSingleFile=false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $p = Start-Process build/dev/RiotAutoLogin.exe -ArgumentList '--describe-build' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw 'Developer startup failed.' }
          $channel = Get-Content build-channel.json -Raw | ConvertFrom-Json
          if (!$channel.development -or $channel.dataDirectory -ne 'RiotClientAutoLogin-Dev' -or $channel.startupSuffix -ne '-Dev') { throw 'Developer build uses public settings.' }
          git rev-parse HEAD | Set-Content build/dev/BUILD.txt
          Compress-Archive build/dev/* build/RiotAutoLogin-Developer.zip

      - name: Restore packaging tool
        run: dotnet tool restore

      - name: Build two versions and verify incremental updates
        shell: pwsh
        run: |
          ./scripts/Build-Release.ps1 -Version 1.5.0 -AssetDir build/assets-base -SkipCompatibilityExe
          ./scripts/Build-Release.ps1 -Version 1.5.1 -AssetDir build/assets-new
          dotnet run --project RiotAutoLogin.Tests/RiotAutoLogin.Tests.csproj -c Release -- --packages build/packages

      - name: Measure launch to a responsive window for both Windows distributions
        shell: pwsh
        run: |
          $paths = @(
            'build/publish-1.5.1/RiotAutoLogin.exe',
            'build/assets-new/RiotAutoLogin-v1.5.1-win-x64.exe'
          )
          if ($env:GITHUB_EVENT_NAME -eq 'pull_request') {
            $base = git rev-parse HEAD^1
            $startupChanges = git diff --name-only $base HEAD -- scripts/Build-Release.ps1 RiotAutoLogin/RiotAutoLogin.csproj RiotAutoLogin/App.xaml RiotAutoLogin/App.xaml.cs RiotAutoLogin/MainWindow.xaml RiotAutoLogin/MainWindow.xaml.cs RiotAutoLogin/Models RiotAutoLogin/Services/AccountService.cs
            if ($startupChanges) {
              $baseline = Join-Path $env:RUNNER_TEMP 'startup-baseline'
              git worktree add --detach $baseline $base
              Push-Location $baseline
              try {
                dotnet tool restore
                ./scripts/Build-Release.ps1 -Version 1.5.1
              } finally { Pop-Location }
              $paths += Join-Path $baseline 'build/publish-1.5.1/RiotAutoLogin.exe'
              $paths += Join-Path $baseline 'build/assets/RiotAutoLogin-v1.5.1-win-x64.exe'
            }
          }
          ./RiotAutoLogin.UiChecks/Measure-Startup.ps1 -Executable $paths -SampleAccounts

      - name: Retain packaging diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package-feed
          path: build/packages/releases.win.json
          retention-days: 7

      - name: Retain account grid preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: account-grid-preview
          path: |
            build/account-grid-preview.png
            build/quick-login-preview.png
            build/farm-statistics-preview.png
            build/accounts-editor-preview.png
            build/update-dialog-preview.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Retain developer preview for testing before merge
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: developer-preview
          path: build/RiotAutoLogin-Developer.zip
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 7
