name: Build

on:
  push:
    branches:
      - master
      - 'codex/**'
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore RiotAutoLogin/RiotAutoLogin.csproj

      - name: Build
        run: dotnet build RiotAutoLogin/RiotAutoLogin.csproj --configuration Release --no-restore /p:ContinuousIntegrationBuild=true

      - name: Verify queue statistics and time tracking
        run: dotnet run --project RiotAutoLogin.Tests/RiotAutoLogin.Tests.csproj --configuration Release

      - name: Restore packaging tool
        run: dotnet tool restore

      - name: Build two versions and verify incremental updates
        shell: pwsh
        run: |
          ./scripts/Build-Release.ps1 -Version 1.5.0 -AssetDir build/assets-base -SkipCompatibilityExe
          ./scripts/Build-Release.ps1 -Version 1.5.1 -AssetDir build/assets-new
          dotnet run --project RiotAutoLogin.Tests/RiotAutoLogin.Tests.csproj -c Release -- --packages build/packages

      - name: Retain packaging diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package-feed
          path: build/packages/releases.win.json
          retention-days: 7
