name: Build release packages

on:
  push:
    tags: ['v*.*.*']
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, for example v1.5.0 (new tags use the selected branch)'
        required: true
        type: string
      notify_users:
        description: Show an update notification to users
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build-and-upload:
    runs-on: windows-latest
    steps:
      - name: Resolve release tag and source
        id: release_info
        uses: actions/github-script@v7
        env:
          INPUT_TAG: ${{ inputs.tag }}
        with:
          script: |
            const raw = context.payload.release?.tag_name || process.env.INPUT_TAG || context.ref.split('/').pop();
            const tag = raw.startsWith('v') ? raw : 'v' + raw;
            if (!/^v\d+\.\d+\.\d+$/.test(tag)) throw new Error('Use a stable tag such as v1.5.0.');
            let ref = context.sha;
            try {
              const result = await github.rest.git.getRef({...context.repo, ref: 'tags/' + tag});
              ref = result.data.object.sha;
            } catch (error) {
              if (error.status !== 404 || context.eventName !== 'workflow_dispatch') throw error;
            }
            core.setOutput('tag', tag);
            core.setOutput('version', tag.substring(1));
            core.setOutput('ref', ref);

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.release_info.outputs.ref }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore packaging tool
        run: dotnet tool restore

      - name: Run behavioral checks
        run: dotnet run --project RiotAutoLogin.Tests/RiotAutoLogin.Tests.csproj -c Release

      - name: Download previous package for delta generation
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.release_info.outputs.version }}
        run: ./scripts/Get-PreviousPackage.ps1 -Repository $env:GITHUB_REPOSITORY -Version $env:RELEASE_VERSION

      - name: Build compressed packages and compatibility executable
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.release_info.outputs.version }}
        run: ./scripts/Build-Release.ps1 -Version $env:RELEASE_VERSION

      - name: Publish assets and notification policy
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release_info.outputs.tag }}
          NOTIFY_USERS: ${{ github.event_name == 'workflow_dispatch' && inputs.notify_users && 'true' || github.event_name == 'workflow_dispatch' && 'false' || 'preserve' }}
        run: |
          $commit = git rev-parse HEAD
          ./scripts/Publish-Release.ps1 -Repository $env:GITHUB_REPOSITORY -Tag $env:RELEASE_TAG -Commit $commit -NotifyUsers $env:NOTIFY_USERS
